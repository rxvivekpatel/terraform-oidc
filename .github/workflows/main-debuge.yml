name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Workflow Ref: ${{ github.workflow_ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"

      - name: Request OIDC Token
        id: oidc
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Decode JWT Header
        run: |
          echo "${{ steps.oidc.outputs.token }}" | cut -d '.' -f1 | base64 -d | jq

      - name: Decode JWT Payload
        run: |
          echo "${{ steps.oidc.outputs.token }}" | cut -d '.' -f2 | base64 -d | jq

      - name: Print Important Claims
        run: |
          PAYLOAD=$(echo "${{ steps.oidc.outputs.token }}" | cut -d '.' -f2 | base64 -d)

          echo "$PAYLOAD" | jq '.sub'
          echo "$PAYLOAD" | jq '.aud'
          echo "$PAYLOAD" | jq '.iss'
          echo "$PAYLOAD" | jq '.repository'
          echo "$PAYLOAD" | jq '.repository_owner'
          echo "$PAYLOAD" | jq '.ref'
          echo "$PAYLOAD" | jq '.job_workflow_ref'
